<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: #6c757d; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; text-decoration: none; font-size: 16px;}
        .btn:hover { background: #5a6268; }
        #orders-container { max-width: 800px; margin: 0 auto; }
        .order-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .order-total { font-weight: bold; font-size: 1.2em; color: #28a745; text-align: right; margin-top: 10px;}
    </style>
</head>
<body>

    <header>
        <h1>My Orders</h1>
        <a href="/" class="btn">Back to Store</a>
    </header>

    <div id="orders-container">
        <p id="loading-msg">Loading your orders...</p>
    </div>

    <script>
        async function fetchMyOrders() {
            try {
                const response = await fetch('/api/my-orders/');
                if (response.status === 403) {
                    window.location.href = '/auth/'; 
                    return;
                }
                
                const orders = await response.json();
                const container = document.getElementById('orders-container');
                document.getElementById('loading-msg').style.display = 'none';

                if (orders.length === 0) {
                    container.innerHTML = '<p>You have not placed any orders yet.</p>';
                    return;
                }

                orders.forEach(order => {
                    let itemsHtml = order.items.map(item => 
                        `<li>${item.qty}x ${item.name} - $${(item.price * item.qty).toFixed(2)}</li>`
                    ).join('');

                    const div = document.createElement('div');
                    div.className = 'order-card';
                    div.innerHTML = `
                        <div class="order-header">
                            <div><strong>Order #${order.id}</strong> <br> <small>${order.date}</small></div>
                            <div>Status: <strong>${order.status}</strong></div>
                        </div>
                        <ul>${itemsHtml}</ul>
                        <div class="order-total">Total: $${parseFloat(order.total).toFixed(2)}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<p>Error loading orders.</p>';
            }
        }

        fetchMyOrders();
    </script>
</body>
</html>
