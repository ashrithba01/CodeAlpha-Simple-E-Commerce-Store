<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
        }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); }
        header { 
            background: var(--card-bg); 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        header h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .btn-outline { 
            background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); 
            padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;
        }
        .btn-outline:hover { background: var(--text-muted); color: white; }
        
        #orders-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .order-card { 
            background: var(--card-bg); padding: 25px; border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; 
        }
        .order-header { 
            display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; 
            padding-bottom: 15px; margin-bottom: 15px; align-items: center;
        }
        .order-header h3 { margin: 0; }
        .status-badge { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600;}
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; padding: 8px 0; color: var(--text-muted); }
        .order-total { font-weight: 600; font-size: 1.2em; color: var(--text-main); text-align: right; margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 15px;}
    </style>
</head>
<body>

    <header>
        <h1>Order History</h1>
        <a href="/" class="btn-outline">Back to Store</a>
    </header>

    <div id="orders-container">
        <p id="loading-msg" style="text-align: center; color: var(--text-muted);">Loading your orders...</p>
    </div>

    <script>
        async function fetchMyOrders() {
            try {
                const response = await fetch('/api/my-orders/');
                if (response.status === 403) {
                    window.location.href = '/auth/'; 
                    return;
                }
                
                const orders = await response.json();
                const container = document.getElementById('orders-container');
                document.getElementById('loading-msg').style.display = 'none';

                if (orders.length === 0) {
                    container.innerHTML = '<div class="order-card" style="text-align:center;">You have not placed any orders yet.</div>';
                    return;
                }

                orders.forEach(order => {
                    let itemsHtml = order.items.map(item => 
                        `<li><span>${item.qty}x ${item.name}</span> <span>₹${(item.price * item.qty).toFixed(2)}</span></li>`
                    ).join('');

                    const div = document.createElement('div');
                    div.className = 'order-card';
                    div.innerHTML = `
                        <div class="order-header">
                            <div>
                                <h3>Order #${order.id}</h3>
                                <small style="color: var(--text-muted);">${order.date}</small>
                            </div>
                            <div class="status-badge">${order.status}</div>
                        </div>
                        <ul>${itemsHtml}</ul>
                        <div class="order-total">Total: ₹${parseFloat(order.total).toFixed(2)}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('orders-container').innerHTML = '<p>Error loading orders.</p>';
            }
        }

        fetchMyOrders();
    </script>
</body>
</html>
